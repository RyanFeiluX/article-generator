name: Docker Publish

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate changelog
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2
            });

            if (tags.length < 2) {
              return "No previous release found.";
            }

            const currentTag = tags[0].name;
            const previousTag = tags[1].name;

            const { data: commits } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: previousTag,
              head: currentTag
            });

            const categories = {
              feat: { title: "🚀 New Features", items: [] },
              fix: { title: "🐛 Bug Fixes", items: [] },
              chore: { title: "🛠️ Chores", items: [] },
              docs: { title: "📝 Documentation", items: [] },
              refactor: { title: "🔄 Refactor", items: [] },
              style: { title: "✨ Style", items: [] },
              improvement: { title: "🔧 Improvements", items: [] },
              other: { title: "📦 Other", items: [] }
            };

            commits.commits.forEach(commit => {
              const message = commit.commit.message.split('\n')[0];
              let category = 'other';
              
              if (message.startsWith('feat:')) category = 'feat';
              else if (message.startsWith('fix:')) category = 'fix';
              else if (message.startsWith('chore:')) category = 'chore';
              else if (message.startsWith('docs:')) category = 'docs';
              else if (message.startsWith('refactor:')) category = 'refactor';
              else if (message.startsWith('style:')) category = 'style';
              else if (message.startsWith('improvement:')) category = 'improvement';
              else if (message.startsWith('enhancement:')) category = 'improvement';
              
              categories[category].items.push(`- ${message}`);
            });

            let changelog = `### ${previousTag} → ${currentTag}\n\n`;
            
            for (const [key, cat] of Object.entries(categories)) {
              if (cat.items.length > 0) {
                changelog += `#### ${cat.title}\n\n${cat.items.join('\n')}\n\n`;
              }
            }

            return changelog;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ${{ steps.changelog.outputs.result }}

            ---

            ## Docker Image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
